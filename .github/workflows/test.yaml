name: Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: [ '1.27' ]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: ${{ matrix.go-version }}

    - name: Check formatting
      run: test -z "$(gofmt -l .)"

    - name: Install lint and vuln tools
      run: make install-tools

    - name: Lint
      run: make lint V=1

    - name: Vulnerability check
      run: make vuln

    - name: Download integration dependencies
      run: cd integration && go mod download

    - name: Run tests
      run: go test -v -race -coverprofile=coverage.txt -covermode=atomic ./...

    - name: Run integration tests
      run: cd integration && go test -v -timeout=5m

    - name: Build
      run: go build -v ./...

    - name: Build examples
      run: make examples V=1

    - name: Fuzz smoke test
      run: make fuzz FUZZTIME=5s

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v7
      with:
        file: ./coverage.txt
        flags: unittests
        name: codecov-umbrella
        token: ${{ secrets.CODECOV_TOKEN }}
      continue-on-error: true
